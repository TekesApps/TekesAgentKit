[package]
name = "tekes-agent-ui-consumer-check"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
native-parent-approval = ["dep:tekes-agent-contract", "dep:tekes-agent-endpoint-kernel", "dep:tekes-agent-session", "dep:tekes-agent-presentation"]
[dependencies]
tekes-agent-components-ui.workspace = true
tekes-agent-ui-bindings.workspace = true
tekes-agent-contract = { workspace = true, optional = true }
tekes-agent-endpoint-kernel = { workspace = true, optional = true }
tekes-agent-session = { workspace = true, optional = true }
tekes-agent-presentation = { workspace = true, optional = true, features = ["acceptance-source-witness"] }

tekes-ui-controls.workspace = true

[dev-dependencies]
serde_json.workspace = true
tekes-ui-text.workspace = true
tekes-ui-scene.workspace = true
tekes-ui-tokens.workspace = true
tokio.workspace = true

[[example]]
name = "native_parent_approval"
required-features = ["native-parent-approval"]
