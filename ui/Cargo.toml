[workspace]
resolver = "3"
members = ["components", "bindings", "demo", "consumer"]
exclude = [".deps/tekesui"]
[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"
[workspace.dependencies]
tekes-agent-endpoint-kernel = { path = "../crates/endpoint-kernel" }
tekes-agent-endpoint-pi = { path = "../crates/endpoint-pi" }
tekes-agent-endpoint-dsh = { path = "../crates/endpoint-dsh" }
tekes-agent-web = { path = "../crates/web" }
tekes-agent-contract = { path = "../crates/contract" }
tekes-agent-session = { path = "../crates/session" }
tekes-agent-presentation = { path = "../crates/presentation" }
tekes-agent-components-ui = { path = "components" }
tekes-agent-ui-bindings = { path = "bindings" }
tekes-ui-controls = { git = "https://github.com/TekesApps/TekesUI.git", rev = "431093786de47b48cd566d0d9c0eafa088b10d68" }
tekes-ui-scene = { git = "https://github.com/TekesApps/TekesUI.git", rev = "431093786de47b48cd566d0d9c0eafa088b10d68" }
tekes-ui-tokens = { git = "https://github.com/TekesApps/TekesUI.git", rev = "431093786de47b48cd566d0d9c0eafa088b10d68" }
tekes-ui-text = { git = "https://github.com/TekesApps/TekesUI.git", rev = "431093786de47b48cd566d0d9c0eafa088b10d68" }
tekes-ui-render = { git = "https://github.com/TekesApps/TekesUI.git", rev = "431093786de47b48cd566d0d9c0eafa088b10d68" }
tekes-ui-platform-macos = { git = "https://github.com/TekesApps/TekesUI.git", rev = "431093786de47b48cd566d0d9c0eafa088b10d68" }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
serde_json = "1"
base64 = "0.22"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
