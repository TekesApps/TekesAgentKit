[workspace]
resolver = "3"
members = ["components", "bindings", "apphost", "demo", "consumer"]
exclude = [".deps/tekesui"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
tekes-agent-contract = { path = "../crates/contract" }
tekes-agent-session = { path = "../crates/session" }
tekes-agent-presentation = { path = "../crates/presentation" }
tekes-agent-endpoint-kernel = { path = "../crates/endpoint-kernel" }
tekes-agent-web = { path = "../crates/web" }

tekes-agent-components-ui = { path = "components" }
tekes-agent-ui-bindings = { path = "bindings" }
tekes-agent-apphost = { path = "apphost" }

tekes-ui-controls = { git = "https://github.com/TekesApps/TekesUI.git", rev = "31114fea1074d16750c7437b140d2d147cbe8eda", features = ["svg-icons", "bitmap-images", "syntax-highlighting"] }
tekes-ui-scene = { git = "https://github.com/TekesApps/TekesUI.git", rev = "31114fea1074d16750c7437b140d2d147cbe8eda" }
tekes-ui-tokens = { git = "https://github.com/TekesApps/TekesUI.git", rev = "31114fea1074d16750c7437b140d2d147cbe8eda" }
tekes-ui-text = { git = "https://github.com/TekesApps/TekesUI.git", rev = "31114fea1074d16750c7437b140d2d147cbe8eda" }
tekes-ui-motion = { git = "https://github.com/TekesApps/TekesUI.git", rev = "31114fea1074d16750c7437b140d2d147cbe8eda" }
tekes-ui-render = { git = "https://github.com/TekesApps/TekesUI.git", rev = "31114fea1074d16750c7437b140d2d147cbe8eda", features = ["macos-shared-surface"] }
tekes-ui-platform-macos = { git = "https://github.com/TekesApps/TekesUI.git", rev = "31114fea1074d16750c7437b140d2d147cbe8eda" }
tekes-ui-icons = { git = "https://github.com/TekesApps/TekesUI.git", rev = "31114fea1074d16750c7437b140d2d147cbe8eda" }
tekes-ui-app-protocol = { git = "https://github.com/TekesApps/TekesUI.git", rev = "31114fea1074d16750c7437b140d2d147cbe8eda" }
tekes-ui-app-host = { git = "https://github.com/TekesApps/TekesUI.git", rev = "31114fea1074d16750c7437b140d2d147cbe8eda" }
tekes-ui-settings = { git = "https://github.com/TekesApps/TekesUI.git", rev = "31114fea1074d16750c7437b140d2d147cbe8eda", features = ["ui", "fs-store"] }

anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
cap-std = "3"
futures-util = "0.3"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util", "process", "fs"] }
unicode-segmentation = "=1.13.3"
uuid = { version = "1", features = ["v4", "serde"] }
