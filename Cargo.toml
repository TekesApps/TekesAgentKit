[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["ui"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT"
repository = "https://github.com/TekesApps/TekesAgentKit"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
async-trait = "0.1"
futures-util = { version = "0.3", features = ["sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util", "process", "fs"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
reqwest = { version = "=0.12.15", default-features = false, features = ["json", "rustls-tls", "stream"] }

base64 = "0.22"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
tokio-util = { version = "0.7", features = ["codec"] }
cap-std = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
