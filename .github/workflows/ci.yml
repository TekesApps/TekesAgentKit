name: AgentKit headless and Web
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - run: node --test scripts/tests/pi-*.test.mjs
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Acceptance source witness
        run: |
          cargo clippy --workspace --all-targets --locked --features tekes-agent-headless/acceptance-source-witness -- -D warnings
          cargo test -p tekes-agent-presentation --locked --features acceptance-source-witness
          cargo test -p tekes-agent-headless --locked --features acceptance-source-witness
      - run: python3 scripts/check-headless-boundaries.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check-ui-boundaries.py
      - name: Headless protocol oracle regression
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
